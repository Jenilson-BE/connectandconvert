    <rect x="640" y="0" width="220" height="260" rx="14" fill="#221830" stroke="#6D28D9" stroke-opacity="0.4"/>
    <text x="664" y="36" fill="#A855F7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">STEP 3: CONVERSION</text>
