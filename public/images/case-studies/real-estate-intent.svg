    <path d="M687 112C687 110.5 688 109 690 109C692 109 693 110.5 693 112C693 113.2 692.3 114.2 691.3 114.7L691.5 116.5L689.5 115.8C688 115.4 687 113.8 687 112Z" fill="#FFFFFF"/>
    <text x="716" y="120" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="12">&lt;5s Brochure Sent</text>
    <circle cx="690" cy="165" r="16" fill="#6D28D9"/>
    <text x="716" y="170" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="12">Budget Verified</text>
    <circle cx="690" cy="215" r="16" fill="#A855F7"/>
    <text x="716" y="220" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="12">Counselor Alerted</text>
