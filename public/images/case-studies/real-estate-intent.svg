<svg width="1000" height="560" viewBox="0 0 1000 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="560" rx="16" fill="#17121F"/>
  <circle cx="200" cy="150" r="220" fill="#6D28D9" fill-opacity="0.2" filter="blur(100px)"/>
  <circle cx="800" cy="400" r="220" fill="#A855F7" fill-opacity="0.25" filter="blur(90px)"/>

  <rect x="70" y="60" width="140" height="32" rx="16" fill="#6D28D9" fill-opacity="0.4"/>
