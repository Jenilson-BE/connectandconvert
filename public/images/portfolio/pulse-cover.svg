<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#17121F"/>
  <circle cx="700" cy="150" r="180" fill="#25D366" fill-opacity="0.12" filter="blur(90px)"/>
  <circle cx="200" cy="350" r="160" fill="#6D28D9" fill-opacity="0.2" filter="blur(80px)"/>
  
  <rect x="60" y="60" width="140" height="32" rx="16" fill="#6D28D9" fill-opacity="0.4"/>
  <rect x="60" y="60" width="140" height="32" rx="16" stroke="#A855F7" stroke-opacity="0.5"/>
  <text x="130" y="81" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">CONCEPT WORK</text>

  <text x="60" y="140" fill="#FAF9FC" font-family="system-ui, sans-serif" font-size="28" font-weight="700">Pulse Academy</text>
  <text x="60" y="175" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="16" font-weight="500">Click-to-WhatsApp Automated Admissions &amp; Syllabus Delivery</text>

  <!-- WhatsApp Chat Mockup -->
  <g transform="translate(60, 220)">
    <!-- Chat Container -->
    <rect x="140" y="0" width="400" height="230" rx="16" fill="#1B1424" stroke="#6D28D9" stroke-opacity="0.4"/>
    <rect x="140" y="0" width="400" height="46" rx="16" fill="#241B33"/>
    <circle cx="168" cy="23" r="14" fill="#25D366"/>
    <path d="M164 20C164 17.8 165.8 16 168 16C170.2 16 172 17.8 172 20C172 21.6 171 22.9 169.6 23.6L169.8 26L167.5 25C165.5 24.5 164 22.4 164 20Z" fill="#FFFFFF"/>
    <text x="192" y="24" fill="#FAF9FC" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Pulse Admissions Bot</text>
    <text x="192" y="36" fill="#A855F7" font-family="system-ui, sans-serif" font-size="10">Verified Business API</text>

    <!-- Bot Message 1 -->
    <rect x="160" y="60" width="280" height="52" rx="10" fill="#2E2440"/>
    <text x="174" y="80" fill="#FAF9FC" font-family="system-ui, sans-serif" font-size="11">Welcome to Pulse! Here is the 2026 Curriculum Guide.</text>
    <text x="174" y="98" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">📎 pulse-syllabus-2026.pdf (3.4 MB)</text>

    <!-- User Response -->
    <rect x="290" y="122" width="230" height="34" rx="10" fill="#6D28D9"/>
    <text x="304" y="143" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11">I would like to speak with an advisor.</text>

    <!-- Interactive Buttons -->
    <rect x="160" y="168" width="170" height="28" rx="8" fill="#2E2440" stroke="#A855F7" stroke-width="1"/>
    <text x="245" y="186" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Book 15-Min Call</text>

    <rect x="340" y="168" width="170" height="28" rx="8" fill="#2E2440" stroke="#A855F7" stroke-width="1"/>
    <text x="425" y="186" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Check Scholarship</text>
  </g>
